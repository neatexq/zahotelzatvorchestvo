.veil{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 0,rgba(10,14,30,.15),rgba(3,4,8,.75))}
.blob{position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;pointer-events:none;will-change:transform}
.b1{background:radial-gradient(circle,rgba(47,91,255,.2),transparent 65%);left:-20vmax;top:-20vmax;animation:float1 32s ease-in-out infinite alternate}
.b2{background:radial-gradient(circle,rgba(209,48,143,.18),transparent 65%);right:-22vmax;bottom:-22vmax;animation:float2 36s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(18vmax,12vmax) scale(1.2)}}
@keyframes float2{to{transform:translate(-16vmax,-10vmax) scale(1.15)}}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{position:relative;border-radius:22px;padding:26px;border:1px solid rgba(255,255,255,.12);background:rgba(14,16,28,.62);box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(26px) scale(.98);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s);transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:rgba(255,255,255,.25)}
@keyframes rise{to{opacity:1;transform:none}}
.track{z-index:5;display:flex;gap:18px;align-items:flex-start}
.cover{width:112px;height:112px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
.eq{display:flex;gap:5px;align-items:flex-end;height:44px}
.eq i{width:7px;border-radius:4px;background:linear-gradient(#8fb0ff,#d76ab0);animation:eq 1.1s ease-in-out infinite;height:100%;transform:scaleY(.3);transform-origin:bottom}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}.eq i:nth-child(5){animation-delay:-.8s}
@keyframes eq{50%{transform:scaleY(1)}}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s;z-index:2}.cover img.on{opacity:1}
.fields{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.f{position:relative}
.f input{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;padding:13px 15px;font:inherit;font-size:15px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
.f input::placeholder{color:#7d839a}
.f input:focus{border-color:#6b8fff;box-shadow:0 0 0 3px rgba(80,120,255,.1);background:rgba(0,0,0,.55)}
#title{font-size:20px;font-weight:800;font-family:Unbounded,Manrope,sans-serif}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:rgba(16,18,32,.96);border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden;z-index:20;display:none;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.dd.open{display:block;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.dd .note{color:#8b91a8;font-size:12.5px;cursor:default}.dd .note:hover{background:none;padding-left:13px}.dd span{flex:1}.dd div{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:15px;cursor:pointer;transition:background .15s,padding-left .15s}
.dd div:hover{background:rgba(100,140,255,.22);padding-left:18px}
.dd img{width:34px;height:34px;border-radius:6px;object-fit:cover;flex:none}.dd small{color:#8b91a8;margin-left:6px}
.sec{font-size:11px;letter-spacing:.14em;color:#8b91a8;margin-bottom:14px;font-weight:800}
.base{--c1:#3d6bff;--c2:#7fd0ff;background:linear-gradient(135deg,rgba(40,70,170,.5),rgba(20,26,70,.58))}
.vibe{--c1:#d1308f;--c2:#ff8fb8;background:linear-gradient(135deg,rgba(150,36,110,.5),rgba(50,20,90,.58))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px 46px}
.head span{font-family:Unbounded,Manrope,sans-serif;font-weight:400;font-size:12.5px;letter-spacing:.08em}.head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;letter-spacing:.05em;margin-bottom:10px}
.head b{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:22px;display:inline-block;min-width:22px;text-align:right}
.head b.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.5);color:var(--c2)}}
.sl{position:relative;height:24px}
.rail{position:absolute;left:0;right:0;top:8px;height:8px;border-radius:5px;background:rgba(0,0,0,.5);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.fill{position:absolute;left:0;top:8px;height:8px;border-radius:5px;width:calc(11px + (100% - 22px)*var(--f));background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 5px var(--c1)}
@keyframes shine{to{background-position:-200% 0}}
.sl input{position:absolute;inset:0;width:100%;margin:0;background:none;-webkit-appearance:none;appearance:none;outline:none;cursor:pointer}
.sl input::-webkit-slider-runnable-track{background:none;height:24px}
.sl input::-moz-range-track{background:none}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:1px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aeb6cf 75%);border:2px solid #20233a;box-shadow:0 0 0 0 var(--c1),0 3px 8px rgba(0,0,0,.5);transition:transform .15s,box-shadow .2s}
.sl input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#cfd5e6;border:2px solid #20233a}
.sl input:hover::-webkit-slider-thumb{transform:scale(1.15)}
.sl input:active::-webkit-slider-thumb{transform:scale(1.3);box-shadow:0 0 0 5px rgba(120,150,255,.14),0 3px 8px rgba(0,0,0,.5)}
.bottom{display:flex;justify-content:flex-start;gap:26px;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:18px}
.ringbox{position:relative;width:110px;height:110px;flex:none}
.ringbox svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:6;stroke-linecap:round}
.rbg{stroke:rgba(255,255,255,.1)}
.rfg{stroke:url(#g);stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 2px rgba(120,150,255,.35))}
.check{position:absolute;inset:17px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:32px;font-weight:800;}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}}
.big{font-family:Unbounded,Manrope,sans-serif;font-size:80px;font-weight:600;line-height:1;background:linear-gradient(180deg,#fff,#aab8ee);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.max{color:#8b91a8;font-size:24px;font-weight:600;align-self:flex-end;margin-bottom:8px}
.digits{font-family:Unbounded,Manrope,sans-serif;margin-top:12px;display:flex;gap:12px;font-weight:800;font-size:18px}
.digits span{display:inline-block}
.digits .b{color:#7c9cff}.digits .v{color:#ff5c93}
.tags{display:flex;flex-wrap:wrap;gap:9px;flex:1;min-width:230px}
.tag{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:all .25s}
.tag:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.tag.on{background:linear-gradient(135deg,#4d73ff,#d1308f);border-color:transparent;}
.logo{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:clamp(140px,26vw,280px);z-index:30;pointer-events:none;opacity:0;animation:fadein 1.4s .8s forwards,bob 7s ease-in-out infinite;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
@keyframes fadein{to{opacity:.95}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
#glow{position:fixed;left:0;top:0;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(110,140,255,.07),transparent 65%);z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s;will-change:transform}
#fx{opacity:.85;position:fixed;inset:0;z-index:-1;pointer-events:none}
.save{margin-left:auto;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:13px;letter-spacing:.04em;color:#fff;border:0;border-radius:16px;padding:18px 34px;cursor:pointer;background:linear-gradient(135deg,#4d73ff,#d1308f);box-shadow:0 6px 18px rgba(120,80,200,.35);transition:transform .2s,box-shadow .2s}
.save:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(120,80,200,.45)}.save:active{transform:scale(.96)}
.hbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:40;width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(18,20,36,.8);color:#dfe4ff;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s}
.hbtn:hover{background:rgba(60,80,170,.7);transform:translateY(-50%) scale(1.08)}
.hbtn i{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:#d1308f;font:700 11px Manrope,sans-serif;font-style:normal;display:none;place-items:center}
.hp{position:fixed;left:0;top:0;bottom:0;width:min(390px,90vw);z-index:50;background:rgba(10,12,24,.95);border-right:1px solid rgba(255,255,255,.14);transform:translateX(-103%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px}
.hp.open{transform:none}
.hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-family:Unbounded,Manrope,sans-serif;font-size:14px}
.hh button,.hnew{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font:600 13px Manrope,sans-serif}
.hh button:hover,.hnew:hover{background:rgba(255,255,255,.16)}
.hnew{margin-bottom:12px;width:100%}
.hl{overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.hi{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);cursor:pointer;transition:background .2s,border-color .2s}
.hi:hover{background:rgba(90,120,255,.16)}.hi.cur{border-color:#6b8fff;background:rgba(90,120,255,.18)}
.hi .th{width:44px;height:44px;border-radius:9px;background:rgba(255,255,255,.08);flex:none;object-fit:cover;display:grid;place-items:center;font-size:18px}
.hi .tx{flex:1;min-width:0}.hi strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi small{color:#8b91a8;font-size:12px}
.hi .sc{font:600 18px Unbounded,Manrope,sans-serif}
.hi .x{background:none;border:0;color:#8b91a8;font-size:18px;cursor:pointer;padding:4px 6px}.hi .x:hover{color:#ff5c93}
.empty{color:#8b91a8;font-size:14px;text-align:center;margin-top:40px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:rgba(20,24,44,.95);border:1px solid rgba(255,255,255,.2);padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.hbtn{width:40px;height:40px}.save{padding:15px 24px}.grid{grid-template-columns:1fr}.big{font-size:54px}.cover{width:72px;height:72px}.track{gap:12px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

const A=$("artist"),T=$("title"),dA=$("ddA"),dT=$("ddT"),cov=$("cov");
const norm=s=>s.trim().toLowerCase();
let cb=0;
function jp(url){return new Promise((res,rej)=>{const n="__jp"+(++cb),s=document.createElement("script");
 const clean=()=>{clearTimeout(t);delete window[n];s.remove()};const t=setTimeout(()=>{clean();rej()},5000);
 window[n]=d=>{clean();res(d)};s.onerror=()=>{clean();rej()};s.src=url+"&callback="+n;document.head.append(s)})}
const IT="https://itunes.apple.com/";
const sz=(u,n)=>u?u.replace(/\d+x\d+bb/,n+"x"+n+"bb"):"";
let curArt='',live=true,pick=null,tracks=[],tk=0,tt=0,tmr;

function setCover(a){curArt=a||'';if(a){cov.src=sz(a,400);cov.classList.add("on")}else cov.classList.remove("on")}
const DZ="https://api.deezer.com/",E=encodeURIComponent;
function fill(dd,items,onpick,note){dd.innerHTML="";
 if(note){const n=document.createElement("div");n.className="note";n.textContent=note;dd.append(n)}
 items.forEach(it=>{const d=document.createElement("div");
  if(it.art){const im=new Image();im.src=sz(it.art,60);d.append(im)}
  const sp=document.createElement("span");sp.textContent=it.name;d.append(sp);
  if(it.sub){const sm=document.createElement("small");sm.textContent=it.sub;d.append(sm)}
  d.onmousedown=e=>{e.preventDefault();onpick(it)};dd.append(d)});
 dd.classList.toggle("open",items.length>0||!!note)}
const localA=q=>{const qq=norm(q);return C.filter(x=>!qq||norm(x.a).includes(qq)).slice(0,7).map(x=>({name:x.a,loc:x}))};
const localT=q=>{const qq=norm(q);return C.flatMap(x=>x.t.map(n=>({name:n,sub:x.a,artist:x.a}))).filter(t=>norm(t.name).includes(qq)).slice(0,8)};
async function ask(p){
 if(p.i){try{return{s:"i",d:await jp(p.i)}}catch(e){}
  try{const r=await fetch(p.i);return{s:"i",d:await r.json()}}catch(e){}}
 try{return{s:"d",d:await jp(p.d)}}catch(e){}
 return null}
const pA=r=>r.s==="i"?(r.d.results||[]).map(x=>({name:x.artistName,id:x.artistId,s:"i"})):(r.d.data||[]).map(x=>({name:x.name,id:x.id,s:"d"}));
const pT=r=>r.s==="i"?(r.d.results||[]).filter(x=>x.trackName).map(x=>({name:x.trackName,artist:x.artistName,art:x.artworkUrl100})):(r.d.data||[]).filter(x=>x.title).map(x=>({name:x.title,artist:x.artist&&x.artist.name,art:x.album&&x.album.cover_medium}));
let loadingT=false;
async function showA(){const q=A.value.trim(),my=++tk;
 if(q.length<2){fill(dA,localA(q),chooseA);return}
 fill(dA,localA(q),chooseA,"Ищу в интернете…");
 const r=await ask({i:IT+"search?entity=musicArtist&country=ru&limit=6&term="+E(q),d:DZ+"search/artist?limit=6&output=jsonp&q="+E(q)});
 if(my!==tk)return;
 if(!r){fill(dA,localA(q),chooseA,"Нет связи с онлайн-поиском — показан встроенный список");return}
 const items=pA(r);fill(dA,items,chooseA,items.length?"":"Ничего не найдено")}
async function chooseA(it){
 pick=it;A.value=it.name;dA.classList.remove("open");tracks=[];setCover();
 if(it.loc){tracks=it.loc.t.map(n=>({name:n}));T.focus();showT();return}
 loadingT=true;T.focus();showT();
 const r=await ask(it.s==="d"?{i:"",d:DZ+"artist/"+it.id+"/top?limit=50&output=jsonp"}:{i:IT+"lookup?entity=song&limit=50&country=ru&id="+it.id,d:DZ+"search?limit=50&output=jsonp&q="+E(it.name)});
 if(r){const seen={};tracks=pT(r).filter(t=>{const k=norm(t.name);if(seen[k])return false;seen[k]=1;return true})}
 loadingT=false;if(pick===it)showT()}
function chooseT(t){T.value=t.name;dT.classList.remove("open");
 const ar=t.artist||(pick&&pick.name);if(ar&&ar!==A.value){A.value=ar;pick={name:ar};tracks=[]}
 setCover(t.art)}
async function showT(){const q=T.value.trim(),my=++tt;
 if(!pick){const m=C.find(c=>norm(c.a)===norm(A.value));if(m){pick={name:m.a,loc:m};tracks=m.t.map(n=>({name:n}))}}
 if(loadingT){fill(dT,[],chooseT,"Загружаю треки…");return}
 let items=tracks.filter(t=>!q||norm(t.name).includes(q)).map(t=>({...t,sub:pick?pick.name:""}));
 if(!pick&&q)items=localT(q);
 if(q.length<2||items.length>=5){fill(dT,items.slice(0,8),chooseT);return}
 fill(dT,items.slice(0,8),chooseT,"Ищу в интернете…");
 const term=(pick?pick.name+" ":"")+q;
 const r=await ask({i:IT+"search?entity=song&country=ru&limit=15&term="+E(term),d:DZ+"search?limit=15&output=jsonp&q="+E(term)});
 if(my!==tt)return;
 if(!r){fill(dT,items.slice(0,8),chooseT,"Нет связи с онлайн-поиском");return}
 const seen={};const all=items.concat(pT(r).map(t=>({...t,sub:t.artist}))).filter(t=>{const k=norm(t.name+"|"+(t.sub||""));if(seen[k])return false;seen[k]=1;return true});
 fill(dT,all.slice(0,8),chooseT,all.length?"":"Ничего не найдено")}
A.addEventListener("input",()=>{pick=null;tracks=[];setCover();deb(showA)});
A.addEventListener("focus",showA);A.addEventListener("blur",()=>dA.classList.remove("open"));
T.addEventListener("input",()=>deb(showT));T.addEventListener("focus",showT);T.addEventListener("blur",()=>dT.classList.remove("open"));

const base=[["rhymes","РИФМЫ / ОБРАЗЫ"],["struct","СТРУКТУРА / РИТМИКА"],["style","РЕАЛИЗАЦИЯ СТИЛЯ"],["indiv","ИНДИВИДУАЛЬНОСТЬ / ХАРИЗМА"]];
const mult=[1,1.0675,1.1349,1.2024,1.2699,1.3373,1.4048,1.4723,1.5397,1.6072];
const vals={rhymes:5,struct:5,style:5,indiv:5,vibe:1};
const row=(id,l)=>`<div><div class="head"><span>${l}</span><b id="v_${id}">${vals[id]}</b></div><div class="sl"><div class="rail"></div><div class="fill" id="f_${id}"></div><input type="range" min="1" max="10" step="1" value="${vals[id]}" id="r_${id}"></div></div>`;
$("baseGrid").innerHTML=base.map(([i,l])=>row(i,l)).join("");
$("vibeRow").innerHTML=row("vibe","АТМОСФЕРА / ВАЙБ");
let shown=0,target=0,raf;
function anim(){shown+=(target-shown)*.14;if(Math.abs(target-shown)<.5)shown=target;$("total").textContent=Math.round(shown);if(shown!==target)raf=requestAnimationFrame(anim)}
function update(id){
 Object.keys(vals).forEach(k=>{const r=$("r_"+k);const n=+r.value;if(n!==vals[k]&&k===id){const b=$("v_"+k);b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
  vals[k]=n;$("v_"+k).textContent=n;$("f_"+k).style.setProperty("--f",(n-1)/9)});
 const total=base.reduce((s,[i])=>s+vals[i],0)*1.4*mult[vals.vibe-1];
 target=Math.round(total);cancelAnimationFrame(raf);anim();
 $("ring").style.strokeDashoffset=264*(1-Math.round(total)/90);
 $("digits").innerHTML=base.map(([i])=>`<span class="b">${vals[i]}</span>`).join("")+`<span class="v">${vals.vibe}</span>`;
}
document.querySelectorAll("input[type=range]").forEach(r=>r.addEventListener("input",()=>update(r.id.slice(2))));

(function(){
 const KEY="zahotel_history_v1";let H=[];try{H=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
 let cur=null,tm;
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(H))}catch(e){}};
 const calc=()=>Math.round(base.reduce((s,[i])=>s+vals[i],0)*1.4*mult[vals.vibe-1]);
 const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("on"),1800)};
 const hp=$("hp"),open=v=>hp.classList.toggle("open",v);
 function render(){const L=$("hl");L.innerHTML="";const c=$("hcount");c.textContent=H.length;c.style.display=H.length?"grid":"none";
  if(!H.length){L.innerHTML='<div class="empty">Пока пусто.<br>Оцени трек и нажми «Сохранить».</div>';return}
  H.slice().sort((a,b)=>b.ts-a.ts).forEach(e=>{const d=document.createElement("div");d.className="hi"+(e.id===cur?" cur":"");
   let th;if(e.art){th=new Image();th.src=sz(e.art,60)}else{th=document.createElement("div");th.textContent="♪"}th.className="th";
   const tx=document.createElement("div");tx.className="tx";const s=document.createElement("strong");s.textContent=e.title;
   const sm=document.createElement("small");sm.textContent=(e.artist?e.artist+" · ":"")+new Date(e.ts).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});tx.append(s,sm);
   const sc=document.createElement("div");sc.className="sc";sc.textContent=e.total;
   const x=document.createElement("button");x.className="x";x.textContent="×";x.title="Удалить";
   x.onclick=ev=>{ev.stopPropagation();H=H.filter(z=>z.id!==e.id);if(cur===e.id)cur=null;persist();render()};
   d.append(th,tx,sc,x);d.onclick=()=>load(e);L.append(d)})}
 function load(e){cur=e.id;T.value=e.title==="Без названия"?"":e.title;A.value=e.artist;pick=null;tracks=[];setCover(e.art);
  Object.keys(vals).forEach(k=>$("r_"+k).value=e.v[k]);update();render();open(false)}
 function save(){const e={id:cur||Date.now(),title:T.value.trim()||"Без названия",artist:A.value.trim(),art:curArt,v:{...vals},total:calc(),ts:Date.now()};
  const i=H.findIndex(z=>z.id===e.id);if(i>=0){H[i]=e;toast("Обновлено")}else{H.push(e);toast("Сохранено")}
  cur=e.id;persist();render()}
 function fresh(){T.value="";A.value="";pick=null;tracks=[];setCover();cur=null;
  Object.keys(vals).forEach(k=>$("r_"+k).value=k==="vibe"?1:5);update();render();open(false)}
 $("save").onclick=save;$("hnew").onclick=fresh;$("hclose").onclick=()=>open(false);
 $("hbtn").onclick=e=>{e.stopPropagation();open(!hp.classList.contains("open"))};
 document.addEventListener("click",e=>{if(!hp.contains(e.target))open(false)});
 addEventListener("keydown",e=>{if(e.key==="Escape")open(false)});
 render();
})();
(function(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const cv=$("fx"),cx=cv.getContext("2d"),gl=$("glow");let W,Hh;
 const rs=()=>{W=cv.width=innerWidth;Hh=cv.height=innerHeight};rs();addEventListener("resize",rs);
 const SP=[];for(let k=0;k<8;k++){const c=document.createElement("canvas");c.width=c.height=48;const g=c.getContext("2d"),r=g.createRadialGradient(24,24,0,24,24,24),hu=215+k*15;
  r.addColorStop(0,"hsla("+hu+",90%,72%,1)");r.addColorStop(.4,"hsla("+hu+",90%,66%,.35)");r.addColorStop(1,"hsla("+hu+",90%,60%,0)");g.fillStyle=r;g.fillRect(0,0,48,48);SP.push(c)}
 let mx=innerWidth/2,my=innerHeight/2,gx=mx,gy=my,P=[],run=false,lx=null,ly=null;
 function tick(){gx+=(mx-gx)*.1;gy+=(my-gy)*.1;gl.style.transform="translate3d("+(gx-190)+"px,"+(gy-190)+"px,0)";
  cx.clearRect(0,0,W,Hh);cx.globalCompositeOperation="lighter";
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.l-=.03;if(p.l<=0){P.splice(i,1);continue}
   const r=p.r*(.5+p.l*.5);cx.globalAlpha=p.l*.3;cx.drawImage(SP[p.s],p.x-r,p.y-r,r*2,r*2)}
  if(P.length||Math.abs(mx-gx)>.5||Math.abs(my-gy)>.5)requestAnimationFrame(tick);else run=false}
 addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;gl.style.opacity=1;
  if(lx===null){lx=mx;ly=my;gx=mx;gy=my}
  const dx=mx-lx,dy=my-ly,n=Math.min(2,Math.ceil(Math.hypot(dx,dy)/26)),b=Math.floor((.5+.5*Math.sin(performance.now()/900))*7);
  for(let i=0;i<n&&P.length<50;i++){const t=i/n;P.push({x:lx+dx*t,y:ly+dy*t,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5-.15,r:9+Math.random()*9,l:1,s:b})}
  lx=mx;ly=my;if(!run){run=true;requestAnimationFrame(tick)}},{passive:true});
})();
setTimeout(()=>update(),400);update();
